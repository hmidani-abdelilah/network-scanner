[package]
name = "network-scanner"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
eframe = "0.28"
egui = "0.28"
pnet = "0.35"
ipnetwork = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
csv = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
